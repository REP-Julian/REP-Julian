<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="100%" height="100%">
  <defs>
    <linearGradient id="card-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2028" />
      <stop offset="100%" stop-color="#20181f" />
    </linearGradient>
    <linearGradient id="bar-ts" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb5a7" />
      <stop offset="100%" stop-color="#fcd5ce" />
    </linearGradient>
    <linearGradient id="bar-js" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fcd5ce" />
      <stop offset="100%" stop-color="#e2b4bd" />
    </linearGradient>
    <linearGradient id="bar-react" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5e4352" />
      <stop offset="100%" stop-color="#9a6e88" />
    </linearGradient>
    <style>
      /* Tranquil Radar Ping */
      @keyframes radarPing {
        0% { transform: scale(1); opacity: 0.9; }
        70% { transform: scale(2.6); opacity: 0; }
        100% { transform: scale(2.6); opacity: 0; }
      }
      .radar-wave {
        transform-box: fill-box;
        transform-origin: center;
        animation: radarPing 3.8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }

      @keyframes beaconBreathe {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }
      .beacon-core { animation: beaconBreathe 2.8s ease-in-out infinite; }

      .bento-title { font-family: 'basisGrotesqueArabicPro-Black', 'Basis Grotesque Arabic Pro Black', 'Basis Grotesque', sans-serif; font-size: 11px; font-weight: 900; letter-spacing: 1.5px; fill: #ffb5a7; }
      .bento-num { font-family: 'basisGrotesqueArabicPro-Black', 'Basis Grotesque Arabic Pro Black', 'Basis Grotesque', sans-serif; font-size: 26px; font-weight: 900; fill: #f8edeb; font-variant-numeric: tabular-nums; }
      .bento-sub { font-family: 'basisGrotesqueArabicPro-Black', 'Basis Grotesque Arabic Pro Black', 'Basis Grotesque', sans-serif; font-size: 11px; font-weight: 900; fill: #fcd5ce; opacity: 0.8; }
    </style>
  </defs>

  <!-- BACKGROUND CANVAS -->
  <rect width="900" height="290" rx="16" fill="#1e161d" stroke="#5e4352" stroke-width="1.6" />

  <!-- ================= TILE 1: COMPLETE TELEMETRY (Left: Full Height 254px) ================= -->
  <g transform="translate(18, 18)">
    <rect width="280" height="254" rx="12" fill="url(#card-grad)" stroke="#5e4352" stroke-width="1.2" />
    <text x="20" y="28" class="bento-title">DEVELOPER TELEMETRY</text>
    
    <!-- Top Stat Row -->
    <g transform="translate(20, 52)">
      <g>
        <text x="0" y="24" class="bento-num">22</text>
        <text x="0" y="44" class="bento-sub">Public Repositories</text>
      </g>
      <g transform="translate(132, 0)">
        <text x="0" y="24" class="bento-num">392+</text>
        <text x="0" y="44" class="bento-sub">Git Contributions</text>
      </g>
    </g>

    <!-- Divider Line -->
    <line x1="20" y1="134" x2="260" y2="134" stroke="#5e4352" stroke-width="1" stroke-dasharray="4,4" opacity="0.6" />

    <!-- Bottom Stat Row -->
    <g transform="translate(20, 154)">
      <g>
        <text x="0" y="24" class="bento-num">99%</text>
        <text x="0" y="44" class="bento-sub">Commit Consistency</text>
      </g>
      <g transform="translate(132, 0)">
        <text x="0" y="24" class="bento-num">100%</text>
        <text x="0" y="44" class="bento-sub">Open Source Focus</text>
      </g>
    </g>
  </g>

  <!-- ================= TILE 2: LANGUAGE ARCHITECTURE (Middle) ================= -->
  <g transform="translate(312, 18)">
    <rect width="320" height="254" rx="12" fill="url(#card-grad)" stroke="#5e4352" stroke-width="1.2" />
    <text x="20" y="28" class="bento-title">CORE LANGUAGE STACK</text>

    <!-- Python -->
    <g transform="translate(20, 50)">
      <text x="0" y="14" fill="#f8edeb" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">JavaScript</text>
      <text x="280" y="14" text-anchor="end" fill="#ffb5a7" font-family="'JetBrains Mono', monospace" font-size="12">42%</text>
      <rect x="0" y="22" width="280" height="7" rx="3.5" fill="#382935" />
      <rect x="0" y="22" width="117" height="7" rx="3.5" fill="url(#bar-ts)" />
    </g>

    <!-- JavaScript -->
    <g transform="translate(20, 98)">
      <text x="0" y="14" fill="#f8edeb" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">CSS</text>
      <text x="280" y="14" text-anchor="end" fill="#fcd5ce" font-family="'JetBrains Mono', monospace" font-size="12">20%</text>
      <rect x="0" y="22" width="280" height="7" rx="3.5" fill="#382935" />
      <rect x="0" y="22" width="56" height="7" rx="3.5" fill="url(#bar-js)" />
    </g>

    <!-- Playwright & Automation -->
    <g transform="translate(20, 146)">
      <text x="0" y="14" fill="#f8edeb" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Python</text>
      <text x="280" y="14" text-anchor="end" fill="#fcd5ce" font-family="'JetBrains Mono', monospace" font-size="12">15%</text>
      <rect x="0" y="22" width="280" height="7" rx="3.5" fill="#382935" />
      <rect x="0" y="22" width="42" height="7" rx="3.5" fill="url(#bar-react)" />
    </g>

    <!-- Local AI & APIs -->
    <g transform="translate(20, 194)">
      <text x="0" y="14" fill="#f8edeb" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Local AI &amp; Cloud APIs</text>
      <text x="280" y="14" text-anchor="end" fill="#ffb5a7" font-family="'JetBrains Mono', monospace" font-size="12">8%</text>
      <rect x="0" y="22" width="280" height="7" rx="3.5" fill="#382935" />
      <rect x="0" y="22" width="22" height="7" rx="3.5" fill="#ffb5a7" />
    </g>
  </g>

  <!-- ================= TILE 3: FLAGSHIP SPRINT (Right) ================= -->
  <g transform="translate(646, 18)">
    <rect width="236" height="254" rx="12" fill="url(#card-grad)" stroke="#5e4352" stroke-width="1.2" />
    <text x="18" y="28" class="bento-title">ACTIVE HORIZON</text>

    <!-- Pulsing Radar with Calm 3.8s Ping -->
    <g transform="translate(18, 50)">
      <circle cx="12" cy="10" r="4" class="radar-wave" fill="none" stroke="#ffb5a7" stroke-width="1.4" />
      <circle cx="12" cy="10" r="4" class="beacon-core" fill="#ffb5a7" />
      <text x="36" y="14" fill="#ffb5a7" font-family="'basisGrotesqueArabicPro-Black', sans-serif" font-size="11" font-weight="900" letter-spacing="0.5">IN PRODUCTION</text>
    </g>

    <!-- Project Identity Card -->
    <g transform="translate(18, 86)">
      <rect width="200" height="82" rx="8" fill="#342531" stroke="#5e4352" stroke-width="1" />
      <text x="12" y="25" fill="#f8edeb" font-family="'basisGrotesqueArabicPro-Black', sans-serif" font-size="12" font-weight="900">QCU-WEEK-2-PROJECT</text>
      <text x="12" y="45" fill="#fcd5ce" font-family="-apple-system, sans-serif" font-size="11" opacity="0.85">AI browser overlay &amp;</text>
      <text x="12" y="61" fill="#fcd5ce" font-family="-apple-system, sans-serif" font-size="11" opacity="0.85">real-time automation 🤖</text>
    </g>

    <!-- Sprint Stats -->
    <g transform="translate(18, 188)">
      <text x="0" y="16" fill="#fcd5ce" font-family="'JetBrains Mono', monospace" font-size="11" opacity="0.8">Status: Public Release</text>
      <text x="0" y="34" fill="#fcd5ce" font-family="'JetBrains Mono', monospace" font-size="11" opacity="0.8">Focus: Vision &amp; Overlays</text>
      <text x="0" y="52" fill="#ffb5a7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Branch: main ↗</text>
    </g>
  </g>
</svg>