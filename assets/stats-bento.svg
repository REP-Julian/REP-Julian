<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="100%" height="100%">
  <defs>
    <linearGradient id="card-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2028" />
      <stop offset="100%" stop-color="#20181f" />
    </linearGradient>
    <linearGradient id="bar-ts" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb5a7" />
      <stop offset="100%" stop-color="#fcd5ce" />
    </linearGradient>
    <linearGradient id="bar-js" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fcd5ce" />
      <stop offset="100%" stop-color="#e2b4bd" />
    </linearGradient>
    <linearGradient id="bar-react" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5e4352" />
      <stop offset="100%" stop-color="#9a6e88" />
    </linearGradient>
    <style>
      /* Precise Concentric Radar Ping */
      @keyframes radarPing {
        0% { r: 5px; opacity: 1; }
        70% { r: 16px; opacity: 0.2; }
        100% { r: 20px; opacity: 0; }
      }
      .radar-wave-1 {
        transform-box: fill-box;
        transform-origin: center;
        animation: radarPing 2.5s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      .radar-wave-2 {
        transform-box: fill-box;
        transform-origin: center;
        animation: radarPing 2.5s cubic-bezier(0.16, 1, 0.3, 1) 1.25s infinite;
      }

      /* Subtle breathing glow on active badge */
      @keyframes beaconBreathe {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }
      .beacon-core { animation: beaconBreathe 2s ease-in-out infinite; }

      .bento-title { font-family: 'basisGrotesqueArabicPro-Black', 'Basis Grotesque Arabic Pro Black', 'Basis Grotesque', sans-serif; font-size: 11px; font-weight: 900; letter-spacing: 1.5px; fill: #ffb5a7; }
      .bento-num { font-family: 'basisGrotesqueArabicPro-Black', 'Basis Grotesque Arabic Pro Black', 'Basis Grotesque', sans-serif; font-size: 26px; font-weight: 900; fill: #f8edeb; font-variant-numeric: tabular-nums; }
      .bento-sub { font-family: 'basisGrotesqueArabicPro-Black', 'Basis Grotesque Arabic Pro Black', 'Basis Grotesque', sans-serif; font-size: 11.5px; font-weight: 900; fill: #fcd5ce; opacity: 0.8; }
    </style>
  </defs>

  <!-- BACKGROUND GRID CANVAS -->
  <rect width="900" height="290" rx="16" fill="#1e161d" stroke="#5e4352" stroke-width="1.6" />

  <!-- ================= TILE 1: CORE METRICS ================= -->
  <g transform="translate(18, 18)">
    <rect width="280" height="120" rx="12" fill="url(#card-grad)" stroke="#5e4352" stroke-width="1.2" />
    <text x="18" y="28" class="bento-title">TELEMETRY // VOLUME</text>
    <g transform="translate(18, 46)">
      <g>
        <text x="0" y="24" class="bento-num">10+</text>
        <text x="0" y="42" class="bento-sub">Active Repositories</text>
      </g>
      <g transform="translate(140, 0)">
        <text x="0" y="24" class="bento-num">380+</text>
        <text x="0" y="42" class="bento-sub">Contributions</text>
      </g>
    </g>
  </g>

  <!-- ================= TILE 2: CRAFT & HABITS ================= -->
  <g transform="translate(18, 150)">
    <rect width="280" height="122" rx="12" fill="url(#card-grad)" stroke="#5e4352" stroke-width="1.2" />
    <text x="18" y="28" class="bento-title">RHYTHM // HABITS</text>
    <g transform="translate(18, 46)">
      <g>
        <text x="0" y="24" class="bento-num">☕ 3.5</text>
        <text x="0" y="42" class="bento-sub">Cups Espresso / Day</text>
      </g>
      <g transform="translate(140, 0)">
        <text x="0" y="24" class="bento-num">🌙 22-02</text>
        <text x="0" y="42" class="bento-sub">Peak Code Velocity</text>
      </g>
    </g>
  </g>

  <!-- ================= TILE 3: LANGUAGE ARCHITECTURE ================= -->
  <g transform="translate(312, 18)">
    <rect width="320" height="254" rx="12" fill="url(#card-grad)" stroke="#5e4352" stroke-width="1.2" />
    <text x="20" y="28" class="bento-title">CORE LANGUAGE STACK</text>

    <!-- TS -->
    <g transform="translate(20, 50)">
      <text x="0" y="14" fill="#f8edeb" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">TypeScript</text>
      <text x="280" y="14" text-anchor="end" fill="#ffb5a7" font-family="'JetBrains Mono', monospace" font-size="12">45%</text>
      <rect x="0" y="22" width="280" height="7" rx="3.5" fill="#382935" />
      <rect x="0" y="22" width="126" height="7" rx="3.5" fill="url(#bar-ts)" />
    </g>

    <!-- React / Next -->
    <g transform="translate(20, 98)">
      <text x="0" y="14" fill="#f8edeb" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">React &amp; Next.js</text>
      <text x="280" y="14" text-anchor="end" fill="#fcd5ce" font-family="'JetBrains Mono', monospace" font-size="12">30%</text>
      <rect x="0" y="22" width="280" height="7" rx="3.5" fill="#382935" />
      <rect x="0" y="22" width="84" height="7" rx="3.5" fill="url(#bar-js)" />
    </g>

    <!-- JS & CSS -->
    <g transform="translate(20, 146)">
      <text x="0" y="14" fill="#f8edeb" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">HTML5 &amp; Modern CSS</text>
      <text x="280" y="14" text-anchor="end" fill="#fcd5ce" font-family="'JetBrains Mono', monospace" font-size="12">15%</text>
      <rect x="0" y="22" width="280" height="7" rx="3.5" fill="#382935" />
      <rect x="0" y="22" width="42" height="7" rx="3.5" fill="url(#bar-react)" />
    </g>

    <!-- Python / Tools -->
    <g transform="translate(20, 194)">
      <text x="0" y="14" fill="#f8edeb" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">Python &amp; Git Tooling</text>
      <text x="280" y="14" text-anchor="end" fill="#ffb5a7" font-family="'JetBrains Mono', monospace" font-size="12">10%</text>
      <rect x="0" y="22" width="280" height="7" rx="3.5" fill="#382935" />
      <rect x="0" y="22" width="28" height="7" rx="3.5" fill="#ffb5a7" />
    </g>
  </g>

  <!-- ================= TILE 4: FLAGSHIP SPRINT WITH CONCENTRIC RADAR ================= -->
  <g transform="translate(646, 18)">
    <rect width="236" height="254" rx="12" fill="url(#card-grad)" stroke="#5e4352" stroke-width="1.2" />
    <text x="18" y="28" class="bento-title">ACTIVE HORIZON</text>

    <!-- Pulsing Radar with Dual Concentric Waves -->
    <g transform="translate(18, 50)">
      <circle cx="10" cy="10" r="5" class="radar-wave-1" fill="none" stroke="#ffb5a7" stroke-width="1.5" />
      <circle cx="10" cy="10" r="5" class="radar-wave-2" fill="none" stroke="#fcd5ce" stroke-width="1.2" />
      <circle cx="10" cy="10" r="5" class="beacon-core" fill="#ffb5a7" />
      <text x="30" y="14" fill="#ffb5a7" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">IN PRODUCTION</text>
    </g>

    <!-- Project Identity Card -->
    <g transform="translate(18, 88)">
      <rect width="200" height="80" rx="8" fill="#342531" stroke="#5e4352" stroke-width="1" />
      <text x="12" y="25" fill="#f8edeb" font-family="-apple-system, sans-serif" font-size="13.5" font-weight="700">PawTrackManagement</text>
      <text x="12" y="44" fill="#fcd5ce" font-family="-apple-system, sans-serif" font-size="11" opacity="0.85">Pet care &amp; community</text>
      <text x="12" y="60" fill="#fcd5ce" font-family="-apple-system, sans-serif" font-size="11" opacity="0.85">adoption network 🐾</text>
    </g>

    <!-- Sprint Stats -->
    <g transform="translate(18, 188)">
      <text x="0" y="16" fill="#fcd5ce" font-family="'JetBrains Mono', monospace" font-size="11" opacity="0.8">Status: Active Dev</text>
      <text x="0" y="34" fill="#fcd5ce" font-family="'JetBrains Mono', monospace" font-size="11" opacity="0.8">Focus: UI Polish &amp; Auth</text>
      <text x="0" y="52" fill="#ffb5a7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Branch: v1.0-release ↗</text>
    </g>
  </g>
</svg>
