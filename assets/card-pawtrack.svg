<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 435 140" width="100%" height="100%">
  <defs>
    <linearGradient id="card-p1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2028" />
      <stop offset="100%" stop-color="#1f181e" />
    </linearGradient>
    <style>
      @keyframes badgePulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
      .live-sprint-dot { animation: badgePulse 1.8s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="435" height="140" rx="14" fill="url(#card-p1)" stroke="#5e4352" stroke-width="1.5" />
  
  <!-- Icon & Header -->
  <g transform="translate(18, 18)">
    <rect width="36" height="36" rx="8" fill="#3a2a37" stroke="#5e4352" stroke-width="1" />
    <text x="18" y="24" text-anchor="middle" font-size="18">🐾</text>
    
    <text x="48" y="18" fill="#f8edeb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">PawTrackManagement</text>
    <!-- Pulsing dot + status -->
    <circle class="live-sprint-dot" cx="52" cy="29" r="3.5" fill="#ffb5a7" />
    <text x="60" y="32" fill="#ffb5a7" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600">FLAGSHIP SPRINT</text>
  </g>

  <!-- Description -->
  <text x="18" y="78" fill="#fcd5ce" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" opacity="0.9">Pet care platform &amp; adoption tracking system.</text>
  <text x="18" y="94" fill="#fcd5ce" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" opacity="0.9">Helping sheltered animals find loving homes.</text>

  <!-- Tags -->
  <g transform="translate(18, 108)">
    <rect width="64" height="20" rx="10" fill="#3a2a37" />
    <text x="32" y="14" text-anchor="middle" fill="#ffb5a7" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600">Pet Care</text>

    <g transform="translate(70, 0)">
      <rect width="70" height="20" rx="10" fill="#3a2a37" />
      <text x="35" y="14" text-anchor="middle" fill="#fcd5ce" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600">Adoption</text>
    </g>

    <g transform="translate(146, 0)">
      <rect width="76" height="20" rx="10" fill="#3a2a37" />
      <text x="38" y="14" text-anchor="middle" fill="#f8edeb" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600">Capstone</text>
    </g>

    <!-- Arrow icon -->
    <text x="398" y="14" text-anchor="end" fill="#ffb5a7" font-family="'JetBrains Mono', monospace" font-size="13">View ↗</text>
  </g>
</svg>
