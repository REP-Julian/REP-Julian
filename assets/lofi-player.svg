<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 120" width="100%" height="100%">
  <defs>
    <linearGradient id="player-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1f28" />
      <stop offset="100%" stop-color="#1e161d" />
    </linearGradient>
    <linearGradient id="bar-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5e4352" />
      <stop offset="60%" stop-color="#ffb5a7" />
      <stop offset="100%" stop-color="#fcd5ce" />
    </linearGradient>
    <style>
      /* Smooth Lo-Fi Vinyl Turntable Spin */
      @keyframes spinVinyl {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .vinyl-core {
        transform-box: fill-box;
        transform-origin: center;
        animation: spinVinyl 16s linear infinite;
      }

      /* Relaxed Lo-Fi Equalizer Amplitude */
      @keyframes eqBar1 { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(0.85); } }
      @keyframes eqBar2 { 0%, 100% { transform: scaleY(0.75); } 50% { transform: scaleY(0.3); } }
      @keyframes eqBar3 { 0%, 100% { transform: scaleY(0.45); } 50% { transform: scaleY(0.95); } }
      @keyframes eqBar4 { 0%, 100% { transform: scaleY(0.85); } 50% { transform: scaleY(0.4); } }
      @keyframes eqBar5 { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(0.75); } }
      @keyframes eqBar6 { 0%, 100% { transform: scaleY(0.7); } 50% { transform: scaleY(0.25); } }

      .eq-b {
        transform-box: fill-box;
        transform-origin: bottom;
      }
      .eq1 { animation: eqBar1 1.8s ease-in-out infinite; }
      .eq2 { animation: eqBar2 1.5s ease-in-out infinite; }
      .eq3 { animation: eqBar3 2.1s ease-in-out infinite; }
      .eq4 { animation: eqBar4 1.7s ease-in-out infinite; }
      .eq5 { animation: eqBar5 1.4s ease-in-out infinite; }
      .eq6 { animation: eqBar6 1.9s ease-in-out infinite; }

      /* Calm Live Status Glow */
      @keyframes softPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      .live-dot { animation: softPulse 2.4s ease-in-out infinite; }

      /* Scrubber Pulse */
      @keyframes scrubberPulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      .scrub-knob {
        transform-box: fill-box;
        transform-origin: center;
        animation: scrubberPulse 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="580" height="120" rx="14" fill="url(#player-bg)" stroke="#5e4352" stroke-width="1.5" />

  <!-- Album Art with Centered Spinning Vinyl (Left: 16, 16) -->
  <g transform="translate(16, 16)">
    <rect width="88" height="88" rx="10" fill="#362834" stroke="#5e4352" stroke-width="1.2" />

    <!-- Centered Vinyl Disc at (44, 44) -->
    <g transform="translate(44, 44)">
      <g class="vinyl-core">
        <circle cx="0" cy="0" r="36" fill="#241a22" stroke="#362834" stroke-width="2" />
        <circle cx="0" cy="0" r="30" fill="none" stroke="#ffb5a7" stroke-width="0.75" stroke-dasharray="5,6" opacity="0.4" />
        <circle cx="0" cy="0" r="24" fill="none" stroke="#fcd5ce" stroke-width="0.6" stroke-dasharray="3,5" opacity="0.3" />
        <circle cx="0" cy="0" r="17" fill="none" stroke="#5e4352" stroke-width="0.75" opacity="0.5" />
      </g>
    </g>

    <!-- Cat Headphone Icon on Top (Fixed Foreground) -->
    <g transform="translate(44, 44)">
      <circle cx="0" cy="0" r="20" fill="#2a1f28" />
      <polygon points="-13,-8 -7,-21 -2,-8" fill="#ffb5a7" />
      <polygon points="13,-8 7,-21 2,-8" fill="#ffb5a7" />
      <path d="M-18 3 A18 18 0 0 1 18 3" fill="none" stroke="#fcd5ce" stroke-width="3" stroke-linecap="round" />
      <rect x="-21" y="-2" width="6" height="12" rx="3" fill="#ffb5a7" />
      <rect x="15" y="-2" width="6" height="12" rx="3" fill="#ffb5a7" />
      <path d="M-8 3 Q-5 6 -2 3" fill="none" stroke="#f8edeb" stroke-width="1.8" stroke-linecap="round" />
      <path d="M2 3 Q5 6 8 3" fill="none" stroke="#f8edeb" stroke-width="1.8" stroke-linecap="round" />
      <polygon points="0,7 -2,10 2,10" fill="#fcd5ce" />
    </g>
  </g>

  <!-- Track Information & Unified Row Layout -->
  <g transform="translate(122, 22)">
    <!-- Row 1: Title + Inline LIVE Pill (No negative space, no awkward floating tag) -->
    <text x="0" y="16" fill="#f8edeb" font-family="'basisGrotesqueArabicPro-Black', 'Basis Grotesque Arabic Pro Black', 'Basis Grotesque', sans-serif" font-size="15" font-weight="900" letter-spacing="0.2">Late Night Lo-Fi Chill</text>
    
    <g transform="translate(202, 1)">
      <rect width="68" height="18" rx="9" fill="#382935" stroke="#5e4352" stroke-width="1" />
      <circle class="live-dot" cx="9" cy="9" r="3" fill="#ffb5a7" />
      <text x="20" y="12.5" fill="#fcd5ce" font-family="'basisGrotesqueArabicPro-Black', 'Basis Grotesque Arabic Pro Black', sans-serif" font-size="9" font-weight="900" letter-spacing="1">LIVE</text>
    </g>

    <!-- Row 2: Subtitle / Radio Station -->
    <text x="0" y="38" fill="#fcd5ce" font-family="'basisGrotesqueArabicPro-Black', 'Basis Grotesque Arabic Pro Black', sans-serif" font-size="11.5" font-weight="900" opacity="0.8">Julian's Radio • 24/7 Coding Session</text>

    <!-- Row 3: Progress Bar & Timestamps -->
    <g transform="translate(0, 56)">
      <rect width="330" height="4.5" rx="2.25" fill="#362834" />
      <rect width="215" height="4.5" rx="2.25" fill="url(#bar-gradient)" />
      <circle class="scrub-knob" cx="215" cy="2.25" r="4.5" fill="#fcd5ce" />
      <text x="0" y="18" fill="#fcd5ce" opacity="0.75" font-family="'JetBrains Mono', monospace" font-size="10">02:30</text>
      <text x="330" y="18" text-anchor="end" fill="#fcd5ce" opacity="0.75" font-family="'JetBrains Mono', monospace" font-size="10">∞</text>
    </g>
  </g>

  <!-- Calm Mellow Equalizer Bars (Aligned on the right) -->
  <g transform="translate(490, 42)">
    <rect class="eq-b eq1" x="0" y="0" width="4" height="26" rx="2" fill="#ffb5a7" />
    <rect class="eq-b eq2" x="8" y="0" width="4" height="26" rx="2" fill="#fcd5ce" />
    <rect class="eq-b eq3" x="16" y="0" width="4" height="26" rx="2" fill="#ffb5a7" />
    <rect class="eq-b eq4" x="24" y="0" width="4" height="26" rx="2" fill="#5e4352" />
    <rect class="eq-b eq5" x="32" y="0" width="4" height="26" rx="2" fill="#ffb5a7" />
    <rect class="eq-b eq6" x="40" y="0" width="4" height="26" rx="2" fill="#fcd5ce" />
  </g>
</svg>