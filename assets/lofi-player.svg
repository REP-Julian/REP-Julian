<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 160" width="100%" height="100%">
  <defs>
    <linearGradient id="player-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#281e26" />
      <stop offset="100%" stop-color="#1c151b" />
    </linearGradient>
    <linearGradient id="bar-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5e4352" />
      <stop offset="50%" stop-color="#ffb5a7" />
      <stop offset="100%" stop-color="#fcd5ce" />
    </linearGradient>
    <radialGradient id="album-glow" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#ffb5a7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#281e26" stop-opacity="0" />
    </radialGradient>
    <filter id="glow-fx" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      /* Vinyl Spin */
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      /* Realistic Frequency EQ Spectrum */
      @keyframes eq-sub { 0%, 100% { height: 6px; } 30% { height: 26px; } 70% { height: 14px; } }
      @keyframes eq-bass { 0%, 100% { height: 22px; } 45% { height: 8px; } 85% { height: 30px; } }
      @keyframes eq-lowmid { 0%, 100% { height: 12px; } 25% { height: 32px; } 60% { height: 18px; } }
      @keyframes eq-mid { 0%, 100% { height: 28px; } 50% { height: 10px; } 80% { height: 34px; } }
      @keyframes eq-highmid { 0%, 100% { height: 16px; } 35% { height: 30px; } 75% { height: 8px; } }
      @keyframes eq-presence { 0%, 100% { height: 24px; } 40% { height: 6px; } 85% { height: 28px; } }
      @keyframes eq-treble { 0%, 100% { height: 8px; } 55% { height: 22px; } 90% { height: 12px; } }
      @keyframes eq-air { 0%, 100% { height: 14px; } 30% { height: 8px; } 70% { height: 20px; } }

      /* Floating Musical Notes */
      @keyframes floatNote1 {
        0% { transform: translate(110px, 60px) scale(0.6); opacity: 0; }
        20% { opacity: 0.9; }
        80% { opacity: 0.8; }
        100% { transform: translate(130px, 15px) scale(1.1); opacity: 0; }
      }
      @keyframes floatNote2 {
        0% { transform: translate(118px, 68px) scale(0.5); opacity: 0; }
        30% { opacity: 0.85; }
        85% { opacity: 0.6; }
        100% { transform: translate(145px, 25px) scale(1.0); opacity: 0; }
      }

      /* Playback Scrubber Progress */
      @keyframes scrubberMove {
        0% { width: 30px; }
        50% { width: 220px; }
        100% { width: 380px; }
      }
      @keyframes thumbMove {
        0% { cx: 190px; }
        50% { cx: 380px; }
        100% { cx: 540px; }
      }
      @keyframes pulseLight {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }

      .vinyl-disc { transform-origin: 80px 80px; animation: spin 7s linear infinite; }
      .b1 { animation: eq-sub 1.1s ease-in-out infinite; }
      .b2 { animation: eq-bass 0.85s ease-in-out infinite; }
      .b3 { animation: eq-lowmid 1.25s ease-in-out infinite; }
      .b4 { animation: eq-mid 0.95s ease-in-out infinite; }
      .b5 { animation: eq-highmid 1.15s ease-in-out infinite; }
      .b6 { animation: eq-presence 0.75s ease-in-out infinite; }
      .b7 { animation: eq-treble 1.05s ease-in-out infinite; }
      .b8 { animation: eq-air 0.9s ease-in-out infinite; }

      .note-a { animation: floatNote1 3.4s ease-out infinite; }
      .note-b { animation: floatNote2 4.2s ease-out 1.7s infinite; }
      .live-glow { animation: pulseLight 1.8s ease-in-out infinite; transform-origin: 172px 35px; }
      .progress-bar-fill { animation: scrubberMove 16s linear infinite; }
      .scrubber-thumb { animation: thumbMove 16s linear infinite; }
    </style>
  </defs>

  <!-- Container Box with Glass Edge -->
  <rect width="580" height="160" rx="16" fill="url(#player-bg)" stroke="#5e4352" stroke-width="1.8" />

  <!-- Album Glow Behind Art -->
  <circle cx="80" cy="80" r="70" fill="url(#album-glow)" />

  <!-- Floating Notes -->
  <text class="note-a" fill="#ffb5a7" font-family="'Segoe UI Emoji', sans-serif" font-size="14">♪</text>
  <text class="note-b" fill="#fcd5ce" font-family="'Segoe UI Emoji', sans-serif" font-size="15">♫</text>

  <!-- Album Art Cover with Spinning Vinyl Groove Accent -->
  <g transform="translate(18, 18)">
    <rect width="124" height="124" rx="12" fill="#362834" stroke="#5e4352" stroke-width="1.5" />
    
    <!-- Rotating Vinyl Rings -->
    <g class="vinyl-disc" opacity="0.65">
      <circle cx="62" cy="62" r="52" fill="none" stroke="#281e26" stroke-width="4" />
      <circle cx="62" cy="62" r="44" fill="none" stroke="#ffb5a7" stroke-width="0.8" stroke-dasharray="8,6" />
      <circle cx="62" cy="62" r="36" fill="none" stroke="#fcd5ce" stroke-width="0.6" stroke-dasharray="4,8" />
      <circle cx="62" cy="62" r="28" fill="none" stroke="#5e4352" stroke-width="0.8" stroke-dasharray="12,10" />
    </g>

    <!-- Cat Silhouette with Lo-Fi Headphones -->
    <circle cx="62" cy="62" r="32" fill="#241a22" />
    <!-- Cat Ears -->
    <polygon points="40,46 50,26 58,46" fill="#ffb5a7" />
    <polygon points="84,46 74,26 66,46" fill="#ffb5a7" />
    <!-- Headphone Arc -->
    <path d="M34 64 A28 28 0 0 1 90 64" fill="none" stroke="#fcd5ce" stroke-width="4.5" stroke-linecap="round" />
    <!-- Headphone Cushions -->
    <rect x="28" y="58" width="10" height="22" rx="5" fill="#ffb5a7" />
    <rect x="86" y="58" width="10" height="22" rx="5" fill="#ffb5a7" />
    <!-- Cat Sleeping Eyes -->
    <path d="M49 64 Q53 67 57 64" fill="none" stroke="#f8edeb" stroke-width="2.2" stroke-linecap="round" />
    <path d="M67 64 Q71 67 75 64" fill="none" stroke="#f8edeb" stroke-width="2.2" stroke-linecap="round" />
    <polygon points="62,70 59,74 65,74" fill="#fcd5ce" />
  </g>

  <!-- Top Status Indicator -->
  <g transform="translate(160, 24)">
    <rect width="98" height="22" rx="11" fill="#382935" stroke="#5e4352" stroke-width="1" />
    <circle class="live-glow" cx="12" cy="11" r="4.2" fill="#ffb5a7" filter="url(#glow-fx)" />
    <text x="24" y="15" fill="#fcd5ce" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1">NOW VIBING</text>
  </g>

  <!-- Track Meta -->
  <text x="160" y="68" fill="#f8edeb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="0.3">Late Night Lo-Fi Study Session</text>
  <text x="160" y="88" fill="#fcd5ce" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" opacity="0.85">Julian's Radio • 24/7 Lo-Fi Beats</text>

  <!-- 8-Band Frequency Spectrum Analyzer -->
  <g transform="translate(484, 68)">
    <rect class="b1" x="0" y="0" width="4" height="12" rx="2" fill="#ffb5a7" transform="rotate(180 2 0)" />
    <rect class="b2" x="8" y="0" width="4" height="22" rx="2" fill="#fcd5ce" transform="rotate(180 10 0)" />
    <rect class="b3" x="16" y="0" width="4" height="16" rx="2" fill="#ffb5a7" transform="rotate(180 18 0)" />
    <rect class="b4" x="24" y="0" width="4" height="28" rx="2" fill="#5e4352" transform="rotate(180 26 0)" />
    <rect class="b5" x="32" y="0" width="4" height="14" rx="2" fill="#ffb5a7" transform="rotate(180 34 0)" />
    <rect class="b6" x="40" y="0" width="4" height="24" rx="2" fill="#fcd5ce" transform="rotate(180 42 0)" />
    <rect class="b7" x="48" y="0" width="4" height="10" rx="2" fill="#ffb5a7" transform="rotate(180 50 0)" />
    <rect class="b8" x="56" y="0" width="4" height="18" rx="2" fill="#fcd5ce" transform="rotate(180 58 0)" />
  </g>

  <!-- Interactive Scrubber Bar & Animated Thumb -->
  <g transform="translate(160, 114)">
    <rect width="380" height="6" rx="3" fill="#362834" />
    <rect class="progress-bar-fill" width="180" height="6" rx="3" fill="url(#bar-gradient)" />
    <!-- Animated Playhead Dot with Glow -->
    <circle class="scrubber-thumb" cy="3" r="5" fill="#f8edeb" stroke="#ffb5a7" stroke-width="2" filter="url(#glow-fx)" />
    
    <text x="0" y="24" fill="#fcd5ce" opacity="0.75" font-family="'JetBrains Mono', monospace" font-size="11">03:14</text>
    <text x="380" y="24" text-anchor="end" fill="#fcd5ce" opacity="0.75" font-family="'JetBrains Mono', monospace" font-size="11">∞</text>
  </g>
</svg>
