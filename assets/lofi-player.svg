<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 160" width="100%" height="100%">
  <defs>
    <linearGradient id="player-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b2129" />
      <stop offset="100%" stop-color="#1f181e" />
    </linearGradient>
    <linearGradient id="bar-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5e4352" />
      <stop offset="70%" stop-color="#ffb5a7" />
      <stop offset="100%" stop-color="#fcd5ce" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      @keyframes eq1 { 0%, 100% { height: 6px; } 50% { height: 26px; } }
      @keyframes eq2 { 0%, 100% { height: 24px; } 50% { height: 8px; } }
      @keyframes eq3 { 0%, 100% { height: 14px; } 50% { height: 32px; } }
      @keyframes eq4 { 0%, 100% { height: 30px; } 50% { height: 10px; } }
      @keyframes eq5 { 0%, 100% { height: 10px; } 50% { height: 22px; } }
      @keyframes pulse-dot { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.85); } }
      @keyframes progress { 0% { width: 40px; } 50% { width: 230px; } 100% { width: 310px; } }

      .bar1 { animation: eq1 1.2s ease-in-out infinite; }
      .bar2 { animation: eq2 0.9s ease-in-out infinite; }
      .bar3 { animation: eq3 1.4s ease-in-out infinite; }
      .bar4 { animation: eq4 1.1s ease-in-out infinite; }
      .bar5 { animation: eq5 0.8s ease-in-out infinite; }
      .live-dot { animation: pulse-dot 2s ease-in-out infinite; transform-origin: 142px 38px; }
      .progress-line { animation: progress 12s linear infinite; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="580" height="160" rx="16" fill="url(#player-bg)" stroke="#5e4352" stroke-width="2" />

  <!-- Album Art Cover -->
  <g transform="translate(18, 18)">
    <rect width="124" height="124" rx="12" fill="#382a36" stroke="#5e4352" stroke-width="1.5" />
    <!-- Cat silhouette with headphones -->
    <circle cx="62" cy="62" r="38" fill="#2b2129" />
    <!-- Cat Ears -->
    <polygon points="36,44 48,22 56,44" fill="#ffb5a7" />
    <polygon points="88,44 76,22 68,44" fill="#ffb5a7" />
    <!-- Headphone Band -->
    <path d="M30 64 A32 32 0 0 1 94 64" fill="none" stroke="#fcd5ce" stroke-width="5" stroke-linecap="round" />
    <!-- Headphone Earcups -->
    <rect x="24" y="58" width="12" height="24" rx="6" fill="#ffb5a7" />
    <rect x="88" y="58" width="12" height="24" rx="6" fill="#ffb5a7" />
    <!-- Cat Face Eyes -->
    <path d="M48 64 Q52 68 56 64" fill="none" stroke="#f8edeb" stroke-width="2.5" stroke-linecap="round" />
    <path d="M68 64 Q72 68 76 64" fill="none" stroke="#f8edeb" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="62,71 59,75 65,75" fill="#fcd5ce" />
    <!-- Vinyl Grooves Accent -->
    <circle cx="62" cy="62" r="54" fill="none" stroke="#ffb5a7" stroke-width="1" stroke-dasharray="3,6" opacity="0.4" />
  </g>

  <!-- Top Status Badge -->
  <g transform="translate(160, 24)">
    <rect width="96" height="22" rx="11" fill="#3a2b37" stroke="#5e4352" stroke-width="1" />
    <circle class="live-dot" cx="12" cy="11" r="4" fill="#ffb5a7" filter="url(#glow)" />
    <text x="24" y="15" fill="#fcd5ce" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="1">NOW VIBING</text>
  </g>

  <!-- Track Title & Artist -->
  <text x="160" y="68" fill="#f8edeb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="0.3">Late Night Lo-Fi Study Session</text>
  <text x="160" y="88" fill="#fcd5ce" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" opacity="0.85">Julian's Radio • 24/7 Code Chillout</text>

  <!-- Animated Sound Equalizer Waves -->
  <g transform="translate(500, 65)">
    <rect class="bar1" x="0" y="0" width="4.5" height="12" rx="2.2" fill="#ffb5a7" transform="rotate(180 2.25 0)" />
    <rect class="bar2" x="9" y="0" width="4.5" height="24" rx="2.2" fill="#fcd5ce" transform="rotate(180 11.25 0)" />
    <rect class="bar3" x="18" y="0" width="4.5" height="18" rx="2.2" fill="#ffb5a7" transform="rotate(180 20.25 0)" />
    <rect class="bar4" x="27" y="0" width="4.5" height="28" rx="2.2" fill="#5e4352" transform="rotate(180 29.25 0)" />
    <rect class="bar5" x="36" y="0" width="4.5" height="14" rx="2.2" fill="#ffb5a7" transform="rotate(180 38.25 0)" />
  </g>

  <!-- Progress Bar Track -->
  <g transform="translate(160, 114)">
    <rect width="380" height="6" rx="3" fill="#3a2a37" />
    <rect class="progress-line" width="220" height="6" rx="3" fill="url(#bar-gradient)" />
    <text x="0" y="24" fill="#fcd5ce" opacity="0.7" font-family="ui-monospace, monospace" font-size="11">02:45</text>
    <text x="380" y="24" text-anchor="end" fill="#fcd5ce" opacity="0.7" font-family="ui-monospace, monospace" font-size="11">∞</text>
  </g>
</svg>
