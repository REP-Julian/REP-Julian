<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 144" width="100%" height="100%">
  <defs>
    <linearGradient id="player-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1f28" />
      <stop offset="100%" stop-color="#1e161d" />
    </linearGradient>
    <linearGradient id="bar-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5e4352" />
      <stop offset="60%" stop-color="#ffb5a7" />
      <stop offset="100%" stop-color="#fcd5ce" />
    </linearGradient>
    <style>
      /* Ultra-smooth 0-coordinate Center Vinyl Spin */
      @keyframes spinVinyl {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .vinyl-core {
        animation: spinVinyl 10s linear infinite;
        transform-origin: 0 0;
      }

      /* Clean Scale-Y Equalizer with fill-box bottom origin */
      @keyframes eqBar1 { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(0.95); } }
      @keyframes eqBar2 { 0%, 100% { transform: scaleY(0.8); } 50% { transform: scaleY(0.25); } }
      @keyframes eqBar3 { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1.0); } }
      @keyframes eqBar4 { 0%, 100% { transform: scaleY(0.9); } 50% { transform: scaleY(0.35); } }
      @keyframes eqBar5 { 0%, 100% { transform: scaleY(0.35); } 50% { transform: scaleY(0.85); } }
      @keyframes eqBar6 { 0%, 100% { transform: scaleY(0.75); } 50% { transform: scaleY(0.2); } }

      .eq-b {
        transform-box: fill-box;
        transform-origin: bottom;
      }
      .eq1 { animation: eqBar1 1.2s ease-in-out infinite; }
      .eq2 { animation: eqBar2 0.95s ease-in-out infinite; }
      .eq3 { animation: eqBar3 1.35s ease-in-out infinite; }
      .eq4 { animation: eqBar4 1.1s ease-in-out infinite; }
      .eq5 { animation: eqBar5 0.85s ease-in-out infinite; }
      .eq6 { animation: eqBar6 1.05s ease-in-out infinite; }

      /* Subtle pulsing live indicator */
      @keyframes softPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      .live-dot { animation: softPulse 2s ease-in-out infinite; }

      /* Steady Progress Fill */
      @keyframes progressSweep {
        0% { width: 50px; }
        50% { width: 230px; }
        100% { width: 380px; }
      }
      .progress-fill { animation: progressSweep 20s linear infinite; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="580" height="144" rx="16" fill="url(#player-bg)" stroke="#5e4352" stroke-width="1.5" />

  <!-- Album Art with Centered Spinning Vinyl -->
  <g transform="translate(18, 18)">
    <rect width="108" height="108" rx="12" fill="#362834" stroke="#5e4352" stroke-width="1.2" />

    <!-- Centered Vinyl Disc Layer at (54, 54) -->
    <g transform="translate(54, 54)">
      <g class="vinyl-core">
        <circle cx="0" cy="0" r="44" fill="#241a22" stroke="#362834" stroke-width="2" />
        <circle cx="0" cy="0" r="38" fill="none" stroke="#ffb5a7" stroke-width="0.75" stroke-dasharray="6,8" opacity="0.4" />
        <circle cx="0" cy="0" r="30" fill="none" stroke="#fcd5ce" stroke-width="0.6" stroke-dasharray="4,6" opacity="0.3" />
        <circle cx="0" cy="0" r="22" fill="none" stroke="#5e4352" stroke-width="0.75" opacity="0.5" />
      </g>
    </g>

    <!-- Cat Illustration on Top (Fixed Foreground) -->
    <g transform="translate(54, 54)">
      <circle cx="0" cy="0" r="24" fill="#2a1f28" />
      <!-- Ears -->
      <polygon points="-16,-10 -9,-26 -2,-10" fill="#ffb5a7" />
      <polygon points="16,-10 9,-26 2,-10" fill="#ffb5a7" />
      <!-- Headphone Arch -->
      <path d="M-22 4 A22 22 0 0 1 22 4" fill="none" stroke="#fcd5ce" stroke-width="3.5" stroke-linecap="round" />
      <rect x="-26" y="-2" width="7" height="15" rx="3.5" fill="#ffb5a7" />
      <rect x="19" y="-2" width="7" height="15" rx="3.5" fill="#ffb5a7" />
      <!-- Eyes & Nose -->
      <path d="M-10 4 Q-7 7 -4 4" fill="none" stroke="#f8edeb" stroke-width="2" stroke-linecap="round" />
      <path d="M4 4 Q7 7 10 4" fill="none" stroke="#f8edeb" stroke-width="2" stroke-linecap="round" />
      <polygon points="0,9 -2.5,12 2.5,12" fill="#fcd5ce" />
    </g>
  </g>

  <!-- Status Chip -->
  <g transform="translate(144, 22)">
    <rect width="92" height="20" rx="10" fill="#382935" stroke="#5e4352" stroke-width="1" />
    <circle class="live-dot" cx="10" cy="10" r="3.5" fill="#ffb5a7" />
    <text x="20" y="14" fill="#fcd5ce" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">NOW VIBING</text>
  </g>

  <!-- Track Info -->
  <text x="144" y="62" fill="#f8edeb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="0.2">Late Night Lo-Fi Chill</text>
  <text x="144" y="80" fill="#fcd5ce" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" opacity="0.85">Julian's Radio • Coding Session</text>

  <!-- Premium Stable Equalizer (Base aligned at bottom) -->
  <g transform="translate(480, 52)">
    <!-- Base line -->
    <rect class="eq-b eq1" x="0" y="0" width="4.5" height="26" rx="2.2" fill="#ffb5a7" />
    <rect class="eq-b eq2" x="8.5" y="0" width="4.5" height="26" rx="2.2" fill="#fcd5ce" />
    <rect class="eq-b eq3" x="17" y="0" width="4.5" height="26" rx="2.2" fill="#ffb5a7" />
    <rect class="eq-b eq4" x="25.5" y="0" width="4.5" height="26" rx="2.2" fill="#5e4352" />
    <rect class="eq-b eq5" x="34" y="0" width="4.5" height="26" rx="2.2" fill="#ffb5a7" />
    <rect class="eq-b eq6" x="42.5" y="0" width="4.5" height="26" rx="2.2" fill="#fcd5ce" />
  </g>

  <!-- Progress Track -->
  <g transform="translate(144, 102)">
    <rect width="380" height="5" rx="2.5" fill="#362834" />
    <rect class="progress-fill" width="140" height="5" rx="2.5" fill="url(#bar-gradient)" />
    <text x="0" y="18" fill="#fcd5ce" opacity="0.75" font-family="'JetBrains Mono', monospace" font-size="10.5">02:30</text>
    <text x="380" y="18" text-anchor="end" fill="#fcd5ce" opacity="0.75" font-family="'JetBrains Mono', monospace" font-size="10.5">∞</text>
  </g>
</svg>
