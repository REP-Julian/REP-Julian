<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 6" width="100%">
  <defs>
    <linearGradient id="div-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2b2129" stop-opacity="0" />
      <stop offset="15%" stop-color="#5e4352" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#ffb5a7" stop-opacity="0.85" />
      <stop offset="85%" stop-color="#5e4352" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#2b2129" stop-opacity="0" />
    </linearGradient>
    <style>
      @keyframes softBreathe {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 0.95; }
      }
      .divider-line { animation: softBreathe 4s ease-in-out infinite; }
    </style>
  </defs>
  <!-- Background hairline -->
  <line x1="40" y1="3" x2="760" y2="3" stroke="#382a36" stroke-width="1" />
  <!-- Glowing breath hairline -->
  <line class="divider-line" x1="80" y1="3" x2="720" y2="3" stroke="url(#div-grad)" stroke-width="1.8" stroke-linecap="round" />
  <!-- Center gem -->
  <circle cx="400" cy="3" r="2.5" fill="#ffb5a7" class="divider-line" />
</svg>
