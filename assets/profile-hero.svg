<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Julian's cozy coding corner</title>
  <desc id="desc">An illustrated lo-fi coding room at night with warm peach light, a moonlit window, a sleeping cat, and a computer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#342633"/>
      <stop offset="55%" stop-color="#2b2129"/>
      <stop offset="100%" stop-color="#211a22"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb5a7" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#5e4352" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4e3949"/>
      <stop offset="100%" stop-color="#2b2129"/>
    </linearGradient>
    <style>
      @keyframes softTwinkleA { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.95; } }
      @keyframes softTwinkleB { 0%, 100% { opacity: 0.85; } 50% { opacity: 0.25; } }
      @keyframes steamRise {
        0% { transform: translateY(0); opacity: 0.65; }
        60% { opacity: 0.3; }
        100% { transform: translateY(-14px); opacity: 0; }
      }
      @keyframes cursorStep { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes statusPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }

      .twinkle-a { animation: softTwinkleA 3.2s ease-in-out infinite; }
      .twinkle-b { animation: softTwinkleB 4.2s ease-in-out infinite; }
      .steam-float { animation: steamRise 3s ease-out infinite; }
      .code-cursor { animation: cursorStep 1s step-end infinite; }
      .beacon-dot { animation: statusPulse 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Ambient Wall -->
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1060" cy="40" r="220" fill="url(#glow)"/>
  <path d="M36 32h1128v356H36z" fill="none" stroke="#5e4352" stroke-opacity=".65" stroke-width="2"/>
  <path d="M60 356h1080" stroke="#5e4352" stroke-width="2" opacity=".8"/>

  <!-- Twinkling Starfield -->
  <g fill="#fcd5ce">
    <circle class="twinkle-a" cx="75" cy="78" r="2.5"/>
    <circle class="twinkle-b" cx="500" cy="75" r="2.2"/>
    <circle class="twinkle-a" cx="580" cy="118" r="2.5"/>
    <circle class="twinkle-b" cx="1110" cy="90" r="2.5"/>
    <circle class="twinkle-a" cx="640" cy="50" r="2.2"/>
    <circle class="twinkle-b" cx="80" cy="320" r="2"/>
    <circle class="twinkle-a" cx="440" cy="45" r="2.2"/>
    <circle class="twinkle-b" cx="960" cy="55" r="2.5"/>
    <path class="twinkle-a" d="M1020 140h8v2h-8zM600 280h8v2h-8z"/>
  </g>

  <!-- ================= ZONE A: TYPOGRAPHY (Left: x=68 to x=560) ================= -->
  <!-- Top System Stamp -->
  <text x="68" y="72" fill="#ffb5a7" font-family="'basisGrotesqueArabicPro-Black', 'Basis Grotesque Arabic Pro Black', 'Basis Grotesque', 'JetBrains Mono', monospace" font-size="12" font-weight="900" letter-spacing="3.5">REP-JULIAN  /  SYSTEM ACTIVE</text>

  <!-- Main Headline -->
  <text x="68" y="146" fill="#f8edeb" font-family="'basisGrotesqueArabicPro-Black', 'Basis Grotesque Arabic Pro Black', 'Basis Grotesque', sans-serif" font-size="52" font-weight="900" letter-spacing="-0.8">Hello, I’m Julian</text>
  <rect x="70" y="168" width="76" height="4" rx="2" fill="#ffb5a7"/>

  <!-- Subtitle -->
  <text x="68" y="214" fill="#fcd5ce" font-family="'basisGrotesqueArabicPro-Black', 'Basis Grotesque Arabic Pro Black', 'Basis Grotesque', sans-serif" font-size="20" font-weight="900">Developer · Student · Curious Maker</text>

  <!-- Tagline -->
  <text x="68" y="250" fill="#f8edeb" fill-opacity=".85" font-family="'basisGrotesqueArabicPro-Black', 'Basis Grotesque Arabic Pro Black', 'Basis Grotesque', sans-serif" font-size="15" font-weight="900">Crafting cozy digital experiences &amp; intuitive web apps.</text>

  <!-- Status Pill -->
  <g transform="translate(68 286)">
    <rect width="186" height="34" rx="17" fill="#5e4352" fill-opacity=".7" stroke="#ffb5a7" stroke-width="1.2"/>
    <circle class="beacon-dot" cx="18" cy="17" r="4.5" fill="#ffb5a7"/>
    <text x="32" y="22" fill="#f8edeb" font-family="'basisGrotesqueArabicPro-Black', 'Basis Grotesque Arabic Pro Black', 'Basis Grotesque', sans-serif" font-size="11.5" font-weight="900" letter-spacing="1">SHIPPING AT NIGHT</text>
  </g>

  <!-- Left Bottom Mantra -->
  <text x="68" y="382" fill="#fcd5ce" fill-opacity=".8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" letter-spacing="2">COFFEE  ·  CURIOSITY  ·  CODE</text>

  <!-- ================= ZONE B: LO-FI ROOM SCENE (Right: x=620 to x=1140) ================= -->
  <!-- Distant Window with Moon and Stars -->
  <g transform="translate(620 60)">
    <rect width="490" height="270" rx="14" fill="#2b2129" stroke="#5e4352" stroke-width="2.5"/>
    <rect x="10" y="10" width="470" height="250" rx="8" fill="#382a36"/>
    <path d="M10 180h470v80H10z" fill="#302430"/>
    <path d="M10 210h470v50H10z" fill="#29202a"/>
    <path d="M10 196h470v14H10z" fill="#5e4352" opacity=".55"/>
    
    <!-- Moon -->
    <circle cx="390" cy="65" r="32" fill="#fcd5ce"/>
    <circle cx="404" cy="54" r="28" fill="#382a36"/>
    
    <!-- Stars in window -->
    <g fill="#f8edeb" opacity=".75">
      <path class="twinkle-a" d="M60 45h5v5h-5z"/>
      <path class="twinkle-b" d="M130 85h5v5h-5z"/>
      <path class="twinkle-a" d="M210 50h5v5h-5z"/>
      <path class="twinkle-b" d="M300 90h5v5h-5z"/>
      <path class="twinkle-a" d="M440 120h5v5h-5z"/>
    </g>

    <!-- Skyline -->
    <path d="M10 200h470v60H10z" fill="#2b2129"/>
    <path d="M10 220h45v-25h16v25h35v-40h22v40h28v-22h20v22h32v-45h22v45h26v-26h16v26h120v40H10z" fill="#211a22"/>
    <path d="M20 248h450" stroke="#5e4352" stroke-width="2.5"/>
  </g>

  <!-- Foreground Desk Setup with Computer, Mug, Plant, and Cat -->
  <g transform="translate(690 180)">
    <!-- Desk Surface -->
    <path d="M0 146h430v14H0z" fill="#5e4352"/>

    <!-- Potted Plant (Left desk) -->
    <g transform="translate(15, 70)">
      <path d="M15 80c-5-25 5-40 20-54 1 15 14 19 12 36 12-8 15-19 14-32 19 18 24 34 14 50z" fill="#806074"/>
      <path d="M35 80c-4-16 4-25 10-34 7 10 11 17 7 34z" fill="#ffb5a7"/>
      <rect x="5" y="76" width="60" height="14" rx="4" fill="#5e4352"/>
    </g>

    <!-- Monitor (Center desk) -->
    <g transform="translate(100, 10)">
      <rect width="200" height="126" rx="10" fill="#5e4352"/>
      <rect x="8" y="8" width="184" height="110" rx="5" fill="url(#screen)"/>
      <!-- Code lines -->
      <path d="M24 30h52M24 46h84M24 62h62M24 78h96" stroke="#fcd5ce" stroke-width="4.5" stroke-linecap="round" opacity=".8"/>
      <path d="M120 30h40M120 46h48M120 62h36" stroke="#ffb5a7" stroke-width="4.5" stroke-linecap="round"/>
      <rect class="code-cursor" x="122" y="74" width="7" height="6" rx="1" fill="#ffb5a7"/>
      <!-- Monitor Stand -->
      <path d="M78 126h44l14 18h-72z" fill="#806074"/>
      <path d="M28 144h144" stroke="#fcd5ce" stroke-width="5" stroke-linecap="round" opacity=".8"/>
    </g>

    <!-- Warm Coffee Cup & Steam (Right desk) -->
    <g transform="translate(320, 105)">
      <rect width="48" height="35" rx="6" fill="#ffb5a7"/>
      <path d="M48 112h8a9 9 0 0 1 0 18h-8" fill="none" stroke="#ffb5a7" stroke-width="5"/>
      <path class="steam-float" d="M16 0 Q10 -12 18 -24" fill="none" stroke="#fcd5ce" stroke-width="2.5" stroke-linecap="round" />
      <path class="steam-float" d="M30 0 Q36 -14 28 -26" fill="none" stroke="#fcd5ce" stroke-width="2.5" stroke-linecap="round" style="animation-delay: 1.5s;" />
    </g>

    <!-- Resting Sleeping Cat (Safely placed in its own clear zone on the desk) -->
    <g transform="translate(245, 114)">
      <path d="M0 16c2-15 11-24 24-25l10 11 10-11c14 2 24 11 26 25-7 14-18 20-35 20S7 30 0 16z" fill="#fcd5ce"/>
      <path d="M4 8l2-22 19 13M54 0l19-13 2 22" fill="#ffb5a7"/>
      <path d="M20 13h4M44 13h4M30 21l4 3 4-3" stroke="#2b2129" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M26 35v8M38 35v8" stroke="#fcd5ce" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Right Bottom Footer -->
  <text x="1110" y="382" text-anchor="end" fill="#fcd5ce" fill-opacity=".8" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12">make it useful · make it clear_</text>
</svg>
