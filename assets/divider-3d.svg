<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 28" width="100%">
  <defs>
    <linearGradient id="railGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FF00A8" stop-opacity="1"/>
      <stop offset="70%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="divGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style><![CDATA[
      .pulse-beam { stroke-dasharray: 50 180; animation: beamMove 2.8s linear infinite; }
      .pulse-beam-rev { stroke-dasharray: 50 180; animation: beamMoveRev 2.8s linear infinite; }
      .core-spin { transform-origin: 450px 14px; animation: spinDiamond 6s linear infinite; }
      @keyframes beamMove { from { stroke-dashoffset: 230; } to { stroke-dashoffset: 0; } }
      @keyframes beamMoveRev { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 230; } }
      @keyframes spinDiamond { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    ]]></style>
  </defs>
  <line x1="20" y1="14" x2="880" y2="14" stroke="url(#railGrad)" stroke-width="1.5"/>
  <line x1="40" y1="14" x2="432" y2="14" stroke="#00F0FF" stroke-width="2.5" filter="url(#divGlow)" class="pulse-beam"/>
  <line x1="468" y1="14" x2="860" y2="14" stroke="#FF00A8" stroke-width="2.5" filter="url(#divGlow)" class="pulse-beam-rev"/>
  <g class="core-spin" filter="url(#divGlow)">
    <polygon points="450,5 459,14 450,23 441,14" fill="#0B1026" stroke="#00F0FF" stroke-width="1.8"/>
    <circle cx="450" cy="14" r="2.5" fill="#FF00A8"/>
  </g>
</svg>
