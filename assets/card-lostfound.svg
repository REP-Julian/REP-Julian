<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 435 140" width="100%" height="100%">
  <defs>
    <linearGradient id="card-p2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2028" />
      <stop offset="100%" stop-color="#1f181e" />
    </linearGradient>
    <style>
      @keyframes badgePulse2 { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
      .live-ai-dot { animation: badgePulse2 2.1s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="435" height="140" rx="14" fill="url(#card-p2)" stroke="#5e4352" stroke-width="1.5" />
  
  <!-- Icon & Header -->
  <g transform="translate(18, 18)">
    <rect width="36" height="36" rx="8" fill="#3a2a37" stroke="#5e4352" stroke-width="1" />
    <text x="18" y="24" text-anchor="middle" font-size="18">🔎</text>
    
    <text x="48" y="18" fill="#f8edeb" font-family="'basisGrotesqueArabicPro-Black', 'Basis Grotesque Arabic Pro Black', 'Basis Grotesque', sans-serif" font-size="15" font-weight="900">Lost-and-Found</text>
    <circle class="live-ai-dot" cx="52" cy="29" r="3.5" fill="#fcd5ce" />
    <text x="60" y="32" fill="#ffb5a7" font-family="'basisGrotesqueArabicPro-Black', 'Basis Grotesque Arabic Pro Black', 'Basis Grotesque', monospace" font-size="10.5" font-weight="900">AI STUDIO EXPERIMENT</text>
  </g>

  <!-- Description -->
  <text x="18" y="78" fill="#fcd5ce" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" opacity="0.9">AI-powered community lost-and-found portal.</text>
  <text x="18" y="94" fill="#fcd5ce" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" opacity="0.9">Matching missing items with intelligent discovery.</text>

  <!-- Tags -->
  <g transform="translate(18, 108)">
    <rect width="70" height="20" rx="10" fill="#3a2a37" />
    <text x="35" y="14" text-anchor="middle" fill="#ffb5a7" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600">Web App</text>

    <g transform="translate(76, 0)">
      <rect width="72" height="20" rx="10" fill="#3a2a37" />
      <text x="36" y="14" text-anchor="middle" fill="#fcd5ce" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600">AI Studio</text>
    </g>

    <g transform="translate(154, 0)">
      <rect width="72" height="20" rx="10" fill="#3a2a37" />
      <text x="36" y="14" text-anchor="middle" fill="#f8edeb" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="600">Prototype</text>
    </g>

    <text x="398" y="14" text-anchor="end" fill="#ffb5a7" font-family="'JetBrains Mono', monospace" font-size="13">View ↗</text>
  </g>
</svg>
