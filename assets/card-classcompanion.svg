<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 180" width="100%" height="100%">
  <defs>
    <linearGradient id="card-p2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241a23" />
      <stop offset="100%" stop-color="#181118" />
    </linearGradient>
    <style>
      @keyframes pulseDot2 { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      .live-dot { animation: pulseDot2 2.4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Card Shell with Specular Border -->
  <rect width="500" height="180" rx="16" fill="url(#card-p2)" stroke="#735367" stroke-width="1.8" />
  
  <!-- Header: Icon + Title + Status -->
  <g transform="translate(20, 18)">
    <rect width="44" height="44" rx="10" fill="#362534" stroke="#735367" stroke-width="1.2" />
    <text x="22" y="29" text-anchor="middle" font-size="22">🎓</text>
    
    <!-- Title: Crisp Pure White for Maximum Readability -->
    <text x="56" y="21" fill="#ffffff" font-family="'basisGrotesqueArabicPro-Black', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" letter-spacing="-0.2">Meet &amp; Teams Class Companion</text>
    
    <!-- Status Badge -->
    <circle class="live-dot" cx="60" cy="36" r="3.5" fill="#ffb5a7" />
    <text x="70" y="39.5" fill="#ffb5a7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">USERSCRIPT // AI VISION</text>
  </g>

  <!-- High-Contrast Body Text (No Opacity Dimming) -->
  <text x="20" y="93" fill="#f8edeb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500">Tampermonkey script for online lectures &amp; video meetings.</text>
  <text x="20" y="117" fill="#fcd5ce" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500">Real-time audio transcription, slide AI vision &amp; smart answers.</text>

  <!-- Tags & Action Row -->
  <g transform="translate(20, 136)">
    <rect width="84" height="26" rx="13" fill="#362534" stroke="#5e4352" stroke-width="1" />
    <text x="42" y="17.5" text-anchor="middle" fill="#ffb5a7" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">JavaScript</text>

    <g transform="translate(92, 0)">
      <rect width="104" height="26" rx="13" fill="#362534" stroke="#5e4352" stroke-width="1" />
      <text x="52" y="17.5" text-anchor="middle" fill="#fcd5ce" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">Tampermonkey</text>
    </g>

    <g transform="translate(204, 0)">
      <rect width="78" height="26" rx="13" fill="#362534" stroke="#5e4352" stroke-width="1" />
      <text x="39" y="17.5" text-anchor="middle" fill="#f8edeb" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">AI Vision</text>
    </g>

    <!-- Arrow CTA -->
    <text x="460" y="17.5" text-anchor="end" fill="#ffb5a7" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">View ↗</text>
  </g>
</svg>