<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 145" width="100%" height="100%">
  <defs>
    <linearGradient id="card-p4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2028" />
      <stop offset="100%" stop-color="#1f181e" />
    </linearGradient>
    <style>
      @keyframes pulseD { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
      .live-dot { animation: pulseD 2.6s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="440" height="145" rx="14" fill="url(#card-p4)" stroke="#5e4352" stroke-width="1.5" />
  
  <!-- Icon & Header -->
  <g transform="translate(18, 18)">
    <rect width="36" height="36" rx="8" fill="#3a2a37" stroke="#5e4352" stroke-width="1" />
    <text x="18" y="24" text-anchor="middle" font-size="18">🛡️</text>
    
    <text x="48" y="17" fill="#f8edeb" font-family="'basisGrotesqueArabicPro-Black', 'Basis Grotesque Arabic Pro Black', 'Basis Grotesque', sans-serif" font-size="12.5" font-weight="900" letter-spacing="-0.2">Social-Media-Autonomous-Report-V2</text>
    <!-- Pulsing dot + status -->
    <circle class="live-dot" cx="52" cy="29" r="3.5" fill="#ffb5a7" />
    <text x="60" y="32" fill="#ffb5a7" font-family="'basisGrotesqueArabicPro-Black', 'Basis Grotesque Arabic Pro Black', sans-serif" font-size="10" font-weight="900" letter-spacing="0.8">AUTONOMOUS DEFENSE // AGENTS</text>
  </g>

  <!-- Description -->
  <text x="18" y="78" fill="#fcd5ce" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" opacity="0.9">Autonomous desktop/web automation reporting malicious profiles.</text>
  <text x="18" y="95" fill="#fcd5ce" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" opacity="0.8">Uses Python &amp; Playwright to track impersonators across platforms.</text>

  <!-- Tags -->
  <g transform="translate(18, 112)">
    <rect width="60" height="20" rx="10" fill="#3a2a37" />
    <text x="30" y="14" text-anchor="middle" fill="#ffb5a7" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Python</text>

    <g transform="translate(66, 0)">
      <rect width="76" height="20" rx="10" fill="#3a2a37" />
      <text x="38" y="14" text-anchor="middle" fill="#fcd5ce" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Playwright</text>
    </g>

    <g transform="translate(148, 0)">
      <rect width="78" height="20" rx="10" fill="#3a2a37" />
      <text x="39" y="14" text-anchor="middle" fill="#f8edeb" font-family="-apple-system, sans-serif" font-size="10" font-weight="600">Anti-Abuse</text>
    </g>

    <!-- Arrow icon -->
    <text x="404" y="14" text-anchor="end" fill="#ffb5a7" font-family="'JetBrains Mono', monospace" font-size="12">View ↗</text>
  </g>
</svg>