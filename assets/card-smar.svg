<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 180" width="100%" height="100%">
  <defs>
    <linearGradient id="card-p4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241a23" />
      <stop offset="100%" stop-color="#181118" />
    </linearGradient>
    <style>
      @keyframes pulseDot4 { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      .live-dot { animation: pulseDot4 2.6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Card Shell with Specular Border -->
  <rect width="500" height="180" rx="16" fill="url(#card-p4)" stroke="#735367" stroke-width="1.8" />
  
  <!-- Header: Icon + Title + Status -->
  <g transform="translate(20, 18)">
    <rect width="44" height="44" rx="10" fill="#362534" stroke="#735367" stroke-width="1.2" />
    <text x="22" y="29" text-anchor="middle" font-size="22">🛡️</text>
    
    <!-- Title: Crisp Pure White for Maximum Readability -->
    <text x="56" y="21" fill="#ffffff" font-family="'basisGrotesqueArabicPro-Black', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" letter-spacing="-0.2">Social-Media-Autonomous-Report-V2</text>
    
    <!-- Status Badge -->
    <circle class="live-dot" cx="60" cy="36" r="3.5" fill="#ffb5a7" />
    <text x="70" y="39.5" fill="#ffb5a7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">AUTONOMOUS DEFENSE // AGENTS</text>
  </g>

  <!-- High-Contrast Body Text (No Opacity Dimming) -->
  <text x="20" y="93" fill="#f8edeb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500">Autonomous desktop &amp; web tool detecting malicious profiles.</text>
  <text x="20" y="117" fill="#fcd5ce" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500">Automates abusive account reporting via Playwright agents.</text>

  <!-- Tags & Action Row -->
  <g transform="translate(20, 136)">
    <rect width="68" height="26" rx="13" fill="#362534" stroke="#5e4352" stroke-width="1" />
    <text x="34" y="17.5" text-anchor="middle" fill="#ffb5a7" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">Python</text>

    <g transform="translate(76, 0)">
      <rect width="88" height="26" rx="13" fill="#362534" stroke="#5e4352" stroke-width="1" />
      <text x="44" y="17.5" text-anchor="middle" fill="#fcd5ce" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">Playwright</text>
    </g>

    <g transform="translate(172, 0)">
      <rect width="90" height="26" rx="13" fill="#362534" stroke="#5e4352" stroke-width="1" />
      <text x="45" y="17.5" text-anchor="middle" fill="#f8edeb" font-family="-apple-system, sans-serif" font-size="11.5" font-weight="600">Anti-Abuse</text>
    </g>

    <!-- Arrow CTA -->
    <text x="460" y="17.5" text-anchor="end" fill="#ffb5a7" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">View ↗</text>
  </g>
</svg>