<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" width="100%" height="100%">
  <defs>
    <linearGradient id="term-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241b23" />
      <stop offset="100%" stop-color="#1a1319" />
    </linearGradient>
    <style>
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor { animation: blink 1s step-end infinite; }
      .t-key { fill: #ffb5a7; font-weight: 600; }
      .t-str { fill: #fcd5ce; }
      .t-val { fill: #f8edeb; }
      .t-punct { fill: #ffb5a7; opacity: 0.7; }
    </style>
  </defs>

  <!-- Terminal Window Shell -->
  <rect width="580" height="320" rx="14" fill="url(#term-bg)" stroke="#5e4352" stroke-width="1.8" />

  <!-- Top Bar -->
  <rect width="580" height="38" rx="14" fill="#30232e" />
  <rect y="24" width="580" height="14" fill="#30232e" />
  <line x1="0" y1="38" x2="580" y2="38" stroke="#5e4352" stroke-width="1.2" />

  <!-- Window Dots -->
  <circle cx="24" cy="19" r="6" fill="#ffb5a7" />
  <circle cx="44" cy="19" r="6" fill="#fcd5ce" />
  <circle cx="64" cy="19" r="6" fill="#5e4352" />

  <!-- Tab title -->
  <rect x="190" y="8" width="200" height="24" rx="6" fill="#241b23" stroke="#5e4352" stroke-width="1" />
  <text x="290" y="24" text-anchor="middle" fill="#ffb5a7" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-size="11.5" font-weight="600">julian.config.ts</text>

  <!-- Code Body -->
  <g font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-size="12" xml:space="preserve">
    <!-- Line 1 -->
    <text x="24" y="68">
      <tspan class="t-key">const</tspan> <tspan class="t-val">engineer</tspan> <tspan class="t-punct">=</tspan> <tspan class="t-punct">{</tspan>
    </text>

    <!-- Line 2 -->
    <text x="44" y="93">
      <tspan class="t-val">name:</tspan> <tspan class="t-str">"Julian Agustino"</tspan><tspan class="t-punct">,</tspan>
    </text>

    <!-- Line 3 -->
    <text x="44" y="118">
      <tspan class="t-val">handle:</tspan> <tspan class="t-str">"@REP-Julian"</tspan><tspan class="t-punct">,</tspan>
    </text>

    <!-- Line 4 -->
    <text x="44" y="143">
      <tspan class="t-val">focus:</tspan> <tspan class="t-str">"AI Automation, Userscripts &amp; Tooling"</tspan><tspan class="t-punct">,</tspan>
    </text>

    <!-- Line 5 -->
    <text x="44" y="168">
      <tspan class="t-val">coreStack:</tspan> <tspan class="t-punct">[</tspan><tspan class="t-str">"Python"</tspan><tspan class="t-punct">, </tspan><tspan class="t-str">"JavaScript"</tspan><tspan class="t-punct">, </tspan><tspan class="t-str">"Playwright"</tspan><tspan class="t-punct">, </tspan><tspan class="t-str">"Ollama"</tspan><tspan class="t-punct">],</tspan>
    </text>

    <!-- Line 6 -->
    <text x="44" y="193">
      <tspan class="t-val">shippingNow:</tspan> <tspan class="t-str">"StepUp-X-Google-Fit 🚀"</tspan><tspan class="t-punct">,</tspan>
    </text>

    <!-- Line 7 -->
    <text x="44" y="218">
      <tspan class="t-val">fuel:</tspan> <tspan class="t-str">"Dark Roast + 24/7 Lo-Fi Beats"</tspan><tspan class="t-punct">,</tspan>
    </text>

    <!-- Line 8 -->
    <text x="44" y="243">
      <tspan class="t-val">philosophy:</tspan> <tspan class="t-str">"Useful first. Intuitive always."</tspan>
    </text>

    <!-- Line 9 -->
    <text x="24" y="268">
      <tspan class="t-punct">};</tspan>
    </text>

    <!-- Line 10 (Interactive command line) -->
    <text x="24" y="296">
      <tspan class="t-key">julian</tspan><tspan class="t-punct"> $ </tspan><tspan class="t-val">pnpm run make-magic</tspan>
      <tspan class="cursor" fill="#ffb5a7">▋</tspan>
    </text>
  </g>
</svg>