<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">A cozy lo-fi coding desk</title>
  <desc id="desc">A warm pastel pixel-inspired night scene with a glowing window, computer, plant, and cup of tea.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#382a36"/>
      <stop offset="100%" stop-color="#2b2129"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5e4352"/>
      <stop offset="100%" stop-color="#3b2c3b"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#513b4c"/>
      <stop offset="100%" stop-color="#2b2129"/>
    </linearGradient>
    <style>
      @keyframes calmTwinkle { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }
      @keyframes calmSteam {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.75; }
      }
      @keyframes screenPulse {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 0.98; }
      }

      .desk-star-1 { animation: calmTwinkle 4.5s ease-in-out infinite; }
      .desk-star-2 { animation: calmTwinkle 5.5s ease-in-out 1.5s infinite; }
      .steam-mug { animation: calmSteam 3.8s ease-in-out infinite; }
      .screen-glow { animation: screenPulse 5s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1000" height="420" rx="24" fill="url(#wall)"/>
  <rect x="0" y="300" width="1000" height="120" fill="#241c24"/>

  <!-- Window Scene (Left) -->
  <rect x="68" y="42" width="260" height="204" rx="10" fill="#5e4352"/>
  <rect x="80" y="54" width="236" height="180" rx="5" fill="url(#window)"/>
  <path d="M80 190h236v44H80z" fill="#382a36"/>
  <path d="M80 205h236v29H80z" fill="#2b2129"/>
  <path d="M90 184h34v-40h26v40h26v-27h30v27h30v-50h28v50h46v-32h20v32h16v50H90z" fill="#2b2129"/>
  
  <!-- Moon -->
  <circle cx="253" cy="98" r="29" fill="#fcd5ce"/>
  <circle cx="264" cy="88" r="25" fill="#5e4352"/>

  <!-- Window Stars -->
  <g fill="#f8edeb">
    <path class="desk-star-1" d="M133 87h7v7h-7z"/>
    <path class="desk-star-2" d="M181 111h5v5h-5z"/>
    <path class="desk-star-1" d="M287 70h6v6h-6z"/>
    <path class="desk-star-2" d="M108 124h5v5h-5z"/>
  </g>

  <!-- Coding Monitor (Center) -->
  <rect x="380" y="52" width="542" height="242" rx="16" fill="#5e4352"/>
  <rect x="392" y="64" width="518" height="218" rx="10" fill="#30242f"/>
  <rect class="screen-glow" x="410" y="82" width="482" height="182" rx="5" fill="url(#screen)"/>

  <!-- Syntax Code Lines -->
  <path d="M452 113h102M452 139h171M452 165h132M452 191h203M452 217h151" stroke="#fcd5ce" stroke-width="6" stroke-linecap="round" opacity=".8"/>
  <path d="M675 113h110M675 139h150M675 165h100M675 191h135" stroke="#ffb5a7" stroke-width="6" stroke-linecap="round" opacity=".9"/>

  <!-- Monitor Stand -->
  <path d="M630 294h46l22 33H608z" fill="#5e4352"/>
  <rect x="552" y="326" width="205" height="13" rx="7" fill="#fcd5ce"/>

  <!-- Keyboard (Width adjusted to 350 to leave clean room for tea mug) -->
  <rect x="440" y="350" width="350" height="12" rx="6" fill="#5e4352"/>
  <g fill="#fcd5ce" opacity=".85">
    <rect x="455" y="348" width="18" height="5" rx="2"/><rect x="480" y="348" width="18" height="5" rx="2"/>
    <rect x="505" y="348" width="18" height="5" rx="2"/><rect x="530" y="348" width="18" height="5" rx="2"/>
    <rect x="555" y="348" width="18" height="5" rx="2"/><rect x="580" y="348" width="18" height="5" rx="2"/>
    <rect x="605" y="348" width="18" height="5" rx="2"/><rect x="630" y="348" width="18" height="5" rx="2"/>
    <rect x="655" y="348" width="18" height="5" rx="2"/><rect x="680" y="348" width="18" height="5" rx="2"/>
    <rect x="705" y="348" width="18" height="5" rx="2"/><rect x="730" y="348" width="18" height="5" rx="2"/>
    <rect x="755" y="348" width="22" height="5" rx="2"/>
  </g>

  <!-- Steaming Tea Mug (Positioned at x=825, completely clear of the keyboard) -->
  <g transform="translate(825, 290)">
    <rect x="0" y="0" width="56" height="42" rx="7" fill="#ffb5a7"/>
    <path d="M56 8 h10 a8 8 0 0 1 0 20 h-10" fill="none" stroke="#ffb5a7" stroke-width="6" stroke-linecap="round"/>
    <path class="steam-mug" d="M18 -8 Q12 -22 20 -34" fill="none" stroke="#fcd5ce" stroke-width="3.5" stroke-linecap="round" />
    <path class="steam-mug" d="M36 -8 Q42 -24 34 -36" fill="none" stroke="#fcd5ce" stroke-width="3.5" stroke-linecap="round" style="animation-delay: 1.8s;" />
  </g>

  <!-- Potted Desk Plant (Left) -->
  <path d="M310 319c-8-35 7-57 25-76 2 23 20 29 17 51 17-10 21-25 20-43 25 24 31 45 19 68z" fill="#5e4352"/>
  <path d="M338 319c-6-23 6-35 13-48 9 14 15 24 10 48z" fill="#ffb5a7"/>
  <rect x="300" y="316" width="100" height="25" rx="7" fill="#5e4352"/>

  <!-- Ambient Light Points -->
  <g fill="#ffb5a7">
    <circle class="desk-star-1" cx="113" cy="282" r="3.5"/>
    <circle class="desk-star-2" cx="150" cy="309" r="3"/>
    <circle class="desk-star-1" cx="243" cy="274" r="3.5"/>
    <circle class="desk-star-2" cx="945" cy="86" r="3"/>
    <circle class="desk-star-1" cx="954" cy="125" r="3.5"/>
  </g>
</svg>
