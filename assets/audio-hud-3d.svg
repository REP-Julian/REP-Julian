<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="100%">
  <defs>
    <linearGradient id="audBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B1026"/>
      <stop offset="50%" stop-color="#140E30"/>
      <stop offset="100%" stop-color="#070B1E"/>
    </linearGradient>
    <linearGradient id="audBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#7B2CBF"/>
      <stop offset="100%" stop-color="#FF00A8"/>
    </linearGradient>
    <linearGradient id="progGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#FF00A8"/>
    </linearGradient>
    <filter id="aGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style><![CDATA[
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; }
      .mono { font-family: 'Fira Code', ui-monospace, monospace; }
      .disc { transform-origin: 76px 75px; animation: spinDisc 7s linear infinite; }
      .live-dot { animation: liveBlink 1.4s ease-in-out infinite; }
      .progress-dot { animation: slideProg 9s linear infinite; }
      @keyframes spinDisc { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes liveBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      @keyframes eqPulse {
        0%, 100% { transform: scaleY(0.32); opacity: 0.65; }
        50% { transform: scaleY(1.05); opacity: 1; }
      }
      @keyframes slideProg {
        0% { transform: translateX(0px); }
        100% { transform: translateX(460px); }
      }
    ]]></style>
  </defs>

  <!-- 3D Extruded Back Layer -->
  <rect x="12" y="12" width="1182" height="132" rx="18" fill="#FF00A8" fill-opacity="0.12" stroke="#FF00A8" stroke-opacity="0.35"/>
  <!-- Main Deck -->
  <rect x="6" y="6" width="1182" height="132" rx="18" fill="url(#audBg)" stroke="url(#audBorder)" stroke-width="1.8"/>

  <!-- Spinning 3D Holo-Disc -->
  <g class="disc" filter="url(#aGlow)">
    <circle cx="76" cy="75" r="42" fill="#050714" stroke="#00F0FF" stroke-width="2" stroke-dasharray="14 6"/>
    <circle cx="76" cy="75" r="28" fill="none" stroke="#FF00A8" stroke-width="1.5" stroke-dasharray="8 8"/>
    <circle cx="76" cy="75" r="10" fill="#00F0FF"/>
    <circle cx="76" cy="75" r="4" fill="#050714"/>
  </g>

  <!-- Track Metadata -->
  <text x="148" y="54" class="title" font-size="24" fill="#E8F7FF">Late Night Neural Lo-Fi</text>
  <g transform="translate(454, 34)">
    <rect width="74" height="24" rx="12" fill="#050714" stroke="#FF00A8" stroke-width="1.2"/>
    <circle cx="15" cy="12" r="4" fill="#FF00A8" filter="url(#aGlow)" class="live-dot"/>
    <text x="26" y="16" class="mono" font-size="11" font-weight="700" fill="#FF00A8">LIVE</text>
  </g>
  <text x="148" y="80" class="mono" font-size="13.5" fill="#9BB0DF">Julian's Radio · 24/7 Autonomous Coding Session</text>

  <!-- Progress Track -->
  <rect x="148" y="102" width="520" height="6" rx="3" fill="#1C284D"/>
  <rect x="148" y="102" width="320" height="6" rx="3" fill="url(#progGrad)" filter="url(#aGlow)"/>
  <circle cx="170" cy="105" r="6" fill="#FFFFFF" stroke="#00F0FF" stroke-width="2" filter="url(#aGlow)" class="progress-dot"/>
  <text x="148" y="126" class="mono" font-size="11" fill="#00F0FF">02:58 // ∞ LOOP</text>

  <!-- 16-Band Animated 3D Equalizer -->
  <g filter="url(#aGlow)">
    <rect x="840" y="64.0" width="9" height="22" rx="4" fill="#00F0FF" style="transform-origin:844.5px 75px; animation: eqPulse 0.85s ease-in-out 0.00s infinite;"/><rect x="859" y="54.0" width="9" height="42" rx="4" fill="#FF00A8" style="transform-origin:863.5px 75px; animation: eqPulse 1.03s ease-in-out 0.12s infinite;"/><rect x="878" y="60.0" width="9" height="30" rx="4" fill="#00F0FF" style="transform-origin:882.5px 75px; animation: eqPulse 1.21s ease-in-out 0.24s infinite;"/><rect x="897" y="47.0" width="9" height="56" rx="4" fill="#FF00A8" style="transform-origin:901.5px 75px; animation: eqPulse 1.39s ease-in-out 0.36s infinite;"/><rect x="916" y="51.0" width="9" height="48" rx="4" fill="#00F0FF" style="transform-origin:920.5px 75px; animation: eqPulse 1.57s ease-in-out 0.00s infinite;"/><rect x="935" y="62.0" width="9" height="26" rx="4" fill="#FF00A8" style="transform-origin:939.5px 75px; animation: eqPulse 0.85s ease-in-out 0.12s infinite;"/><rect x="954" y="44.0" width="9" height="62" rx="4" fill="#00F0FF" style="transform-origin:958.5px 75px; animation: eqPulse 1.03s ease-in-out 0.24s infinite;"/><rect x="973" y="56.0" width="9" height="38" rx="4" fill="#FF00A8" style="transform-origin:977.5px 75px; animation: eqPulse 1.21s ease-in-out 0.36s infinite;"/><rect x="992" y="49.0" width="9" height="52" rx="4" fill="#00F0FF" style="transform-origin:996.5px 75px; animation: eqPulse 1.39s ease-in-out 0.00s infinite;"/><rect x="1011" y="61.0" width="9" height="28" rx="4" fill="#FF00A8" style="transform-origin:1015.5px 75px; animation: eqPulse 1.57s ease-in-out 0.12s infinite;"/><rect x="1030" y="45.0" width="9" height="60" rx="4" fill="#00F0FF" style="transform-origin:1034.5px 75px; animation: eqPulse 0.85s ease-in-out 0.24s infinite;"/><rect x="1049" y="53.0" width="9" height="44" rx="4" fill="#FF00A8" style="transform-origin:1053.5px 75px; animation: eqPulse 1.03s ease-in-out 0.36s infinite;"/><rect x="1068" y="59.0" width="9" height="32" rx="4" fill="#00F0FF" style="transform-origin:1072.5px 75px; animation: eqPulse 1.21s ease-in-out 0.00s infinite;"/><rect x="1087" y="48.0" width="9" height="54" rx="4" fill="#FF00A8" style="transform-origin:1091.5px 75px; animation: eqPulse 1.39s ease-in-out 0.12s infinite;"/><rect x="1106" y="55.0" width="9" height="40" rx="4" fill="#00F0FF" style="transform-origin:1110.5px 75px; animation: eqPulse 1.57s ease-in-out 0.24s infinite;"/><rect x="1125" y="63.0" width="9" height="24" rx="4" fill="#FF00A8" style="transform-origin:1129.5px 75px; animation: eqPulse 0.85s ease-in-out 0.36s infinite;"/>
  </g>
</svg>
