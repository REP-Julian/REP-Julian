name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: REP-Julian
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%235e4352&color_dots=%23f8edeb,%23fcd5ce,%23ffb5a7,%235e4352,%232b2129
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ffb5a7&color_dots=%232b2129,%235e4352,%238c6479,%23d69a94,%23ffb5a7

      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
