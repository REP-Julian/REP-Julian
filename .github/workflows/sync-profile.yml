name: Auto-Sync Profile Telemetry & Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/stats-bento.svg"
      - "assets/terminal-card.svg"

permissions:
  contents: write

jobs:
  sync-telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Profile Auto-Updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update_profile.py

      - name: Commit & Push Profile Telemetry Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-bento.svg assets/terminal-card.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore(telemetry): auto-update contributions & repo telemetry [skip ci]"
            git push origin main
          else
            echo "No telemetry changes to commit."
          fi

  generate-snake:
    needs: sync-telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: REP-Julian
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%235e4352&color_dots=%23f8edeb,%23fcd5ce,%23ffb5a7,%235e4352,%232b2129
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ffb5a7&color_dots=%232b2129,%235e4352,%238c6479,%23d69a94,%23ffb5a7

      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
